name: Vydys Quality Gate

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - "improvement/**"

permissions:
  contents: read

jobs:
  validate:
    name: Types, regression tests, and production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      # Existing repository has no package-lock.json. Prefer npm ci once added.
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Verify types, regression tests and production build
        run: npm run check
